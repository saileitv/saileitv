<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App 下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
        }
        .app-icon {
            width: 80px;
            height: 80px;
            background-color: #e0e0e0;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
            word-break: break-all;
        }
        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #007aff;
            border-radius: 50px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .download-btn:active {
            background-color: #005bb5;
        }
        
        /* 微信遮罩层样式 */
        .wechat-mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 9999;
        }
        .wechat-mask-content {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            text-align: right;
            font-size: 18px;
            line-height: 1.6;
        }
        .arrow {
            font-size: 40px;
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 1s infinite alternate;
        }
        @keyframes bounce {
            from { transform: translate(0, 0); }
            to { transform: translate(-10px, 10px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-icon">📦</div>
        <h1 id="app-title">正在加载...</h1>
        <a href="#" id="download-btn" class="download-btn">点击下载</a>
    </div>

    <div id="wechat-mask" class="wechat-mask">
        <div class="wechat-mask-content">
            <div class="arrow">↗️</div>
            <p>请点击右上角</p>
            <p>选择 <b>“在浏览器打开”</b></p>
            <p>以继续下载</p>
        </div>
    </div>

    <script>
        function getUrlParam(name) {
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            return urlParams.get(name);
        }

        function isWeChat() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.indexOf('micromessenger') !== -1;
        }

        window.onload = function() {
            // 获取参数
            const title = getUrlParam('title') || 'App 下载';
            const appname = getUrlParam('appname') || 'default';

            // 拼接相对路径（这里默认拼接在当前目录，并加上 .apk 后缀）
            // 如果你的包放在特定文件夹（如 downloads/），可以改成：const downloadPath = './downloads/' + appname + '.apk';
            const downloadPath = 'https://d.sai' + 'lei.dpdns.org/app' + '/' + appname + '.apk';

            // 更新 DOM 元素
            document.getElementById('app-title').innerText = title;
            document.title = title; 
            document.getElementById('download-btn').href = downloadPath;

            // 微信环境检测与拦截
            if (isWeChat()) {
                const mask = document.getElementById('wechat-mask');
                mask.style.display = 'block';
                
                mask.onclick = function() {
                    mask.style.display = 'none';
                };

                document.getElementById('download-btn').onclick = function(e) {
                    e.preventDefault(); // 阻止原有的相对路径下载跳转
                    mask.style.display = 'block';
                };
            }
        };
    </script>
</body>
</html>
